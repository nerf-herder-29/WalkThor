name: Screenshots

# Renders WalkThor's screens at 1240x1080 with sample content. Push to a screenshots/** branch
# (or run manually) and download the "WalkThor-screenshots" artifact.
on:
  push:
    branches: ["screenshots/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch font candidates (preview only)
        run: |
          pip install fonttools
          mkdir -p fontsrc
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSLo fontsrc/inter.ttf "$base/inter/Inter%5Bopsz,wght%5D.ttf"
          curl -fsSLo fontsrc/manrope.ttf "$base/manrope/Manrope%5Bwght%5D.ttf"
          curl -fsSLo fontsrc/dmsans.ttf "$base/dmsans/DMSans%5Bopsz,wght%5D.ttf"
          curl -fsSLo fontsrc/spacegrotesk.ttf "$base/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          curl -fsSLo fontsrc/outfit.ttf "$base/outfit/Outfit%5Bwght%5D.ttf"
          python3 - <<'PY'
          import os
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          for f in sorted(os.listdir("fontsrc")):
              name = f[:-4]
              os.makedirs(f"app/build/fonts/{name}", exist_ok=True)
              for w in (400, 500, 600, 700):
                  font = TTFont(f"fontsrc/{f}")
                  axes = {a.axisTag: a.defaultValue for a in font["fvar"].axes}
                  lo, hi = [(a.minValue, a.maxValue) for a in font["fvar"].axes if a.axisTag == "wght"][0]
                  axes["wght"] = max(lo, min(hi, w))
                  instantiateVariableFont(font, axes, inplace=True, updateFontNames=False)
                  font.save(f"app/build/fonts/{name}/{w}.ttf")
          PY
          ls -R app/build/fonts
      - name: Render screenshots
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests "*StoreScreenshots*" 2>&1 | tee test.log
      - name: Report failures
        if: failure()
        run: |
          msg=$( { grep -E "^e: |FAILED|Exception|Error" test.log; find app/build/test-results -name "*.xml" -exec grep -h -A6 "<failure" {} \; ; } | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Screenshot run failed::${msg}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WalkThor-screenshots
          path: app/build/screenshots/*.png
      - name: Commit screenshots to the branch
        if: success()
        run: |
          mkdir -p docs/screenshots
          cp app/build/screenshots/*.png docs/screenshots/
          mkdir -p docs/fonts && cp -r app/build/fonts/* docs/fonts/
          cp app/build/screenshots/*.txt docs/screenshots/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Rendered screenshots [skip ci]" || echo "No changes"
          git push

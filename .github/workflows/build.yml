name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.WALKTHOR_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/walkthor-release.jks"
            echo "WALKTHOR_KEYSTORE_FILE=$RUNNER_TEMP/walkthor-release.jks" >> "$GITHUB_ENV"
            echo "Release APK will be signed with the WalkThor key."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error title=Signing key missing::Add the WALKTHOR_KEYSTORE and WALKTHOR_KEY_PASSWORD repository secrets before tagging a release, or the APK won't install as an update."
            exit 1
          else
            echo "::warning title=Signing key missing::WALKTHOR_KEYSTORE secret not set; release APK is signed with a throwaway debug key."
          fi

      - name: Build debug and release APKs
        env:
          WALKTHOR_KEY_PASSWORD: ${{ secrets.WALKTHOR_KEY_PASSWORD }}
          # Optional: ScreenScraper developer credentials built into release APKs.
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Show the APK's permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          perms=$("$AAPT2" dump permissions app/build/outputs/apk/release/*.apk | grep -i "uses-permission" | sed 's/.*name=//' | tr -d "'" | tr '\n' ' ')
          echo "::notice title=APK permissions::${perms:-none}"
          # Internet is only for artwork scraping (opt-in). RECORD_AUDIO is only for Captions, which captures
          # the game's own sound (Android requires it for that); the microphone is never used.
          unexpected=$(echo "$perms" | tr ' ' '\n' | grep -E "READ_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|CAMERA|READ_SMS" || true)
          if [ -n "$unexpected" ]; then
            echo "::error title=Unexpected permission::$unexpected"; exit 1
          fi

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as an annotation so they're readable without the raw log.
          msg=$( { grep -E "^e: " build.log; grep -E "^\* What went wrong" -A4 build.log; } | grep -v "^> Task" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: WalkThor-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WalkThor ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: app/build/outputs/apk/release/*.apk
          # Every tagged build goes out as a pre-release, so it can be tested before anyone gets it
          # as "latest". Promote it on GitHub (edit the release, untick pre-release, tick latest) once it's good.
          prerelease: true
          make_latest: false
